<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Aigerim Zhalgasbekova — Senior Software Engineer, Identity and Access">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#12203a"/>
      <stop offset="100%" stop-color="#1b2f52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- soft glow accents -->
  <circle cx="1055" cy="70" r="200" fill="#38bdf8" opacity="0.10"/>
  <circle cx="1150" cy="250" r="150" fill="#818cf8" opacity="0.10"/>

  <!-- left accent bar -->
  <rect x="80" y="86" width="5" height="128" rx="2.5" fill="url(#accent)"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="118" y="128" font-size="52" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">
      Aigerim Zhalgasbekova
    </text>
    <text x="118" y="172" font-size="24" font-weight="500" fill="#7dd3fc" letter-spacing="0.3">
      Senior Software Engineer · Identity &amp; Access
    </text>
    <text x="118" y="212" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="1.4">
      TypeScript · Go · Python · AWS · OAuth 2.0 · OpenID Connect
    </text>
  </g>

  <!-- lock glyph -->
  <g transform="translate(980 100)" fill="none" stroke="url(#accent)" stroke-width="7" opacity="0.85">
    <rect x="0" y="46" width="112" height="82" rx="14" stroke-linejoin="round"/>
    <path d="M22 46 V30 a34 34 0 0 1 68 0 V46" stroke-linecap="round"/>
    <circle cx="56" cy="86" r="11" fill="url(#accent)" stroke="none"/>
  </g>
</svg>
